name: Nightly Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Setup Swiss Ephemeris
        shell: pwsh
        run: pwsh scripts/setup_swisseph.ps1
      - run: flutter build apk --release
      # Rename APK to be more descriptive before upload
      - run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/AstroNaksh-Android.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/AstroNaksh-Android.apk

  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Setup Swiss Ephemeris
        shell: pwsh
        run: pwsh scripts/setup_swisseph.ps1
      - run: dart run flutter_launcher_icons
      - run: flutter build windows --release
      - name: Compile Inno Setup Script
        run: iscc windows/installer.iss
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: windows/Output/astronaksh_setup.exe

  release:
    name: Create Nightly Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Update Nightly Tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f nightly
          git push -f origin nightly

      - name: Update Nightly Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "artifacts/android-apk/AstroNaksh-Android.apk,artifacts/windows-installer/astronaksh_setup.exe"
          body: "Nightly Build - Latest development version"
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: nightly
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: false
          prerelease: true
          generateReleaseNotes: true
